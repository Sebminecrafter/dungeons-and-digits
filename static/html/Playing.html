<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Player Movement</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: #111;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <!-- Linking our JavaScript file -->
    <script>
        const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Player properties
const player = {
    x: 280,
    y: 180,
    width: 40,
    height: 40,
    speed: 5,
    color: "#00FFCC"
};

// Track currently pressed keys
const keys = {};

// Listen for key presses
window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
});

// Listen for key releases
window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

// Update player position based on input
function updatePlayerPosition() {
    if (keys["ArrowUp"] || keys["w"]) {
        player.y -= player.speed;
    }
    if (keys["ArrowDown"] || keys["s"]) {
        player.y += player.speed;
    }
    if (keys["ArrowLeft"] || keys["a"]) {
        player.x -= player.speed;
    }
    if (keys["ArrowRight"] || keys["d"]) {
        player.x += player.speed;
    }

    // Canvas boundary collisions (Keep player inside the box)
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    if (player.y < 0) player.y = 0;
    if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
}

// Draw the player onto the canvas
function drawPlayer() {
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);
}

// Main game loop running smoothly at 60 FPS
function gameLoop() {
    // 1. Clear the entire canvas from the previous frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 2. Update player position
    updatePlayerPosition();

    // 3. Redraw the player
    drawPlayer();

    // 4. Repeat the loop
    requestAnimationFrame(gameLoop);
}

// Start the game loop
gameLoop();

    </script>
</body>
</html>
