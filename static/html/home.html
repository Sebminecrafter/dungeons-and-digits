<div id="ui-layer">
    
    <section id="screen-main" class="screen active">
        <div class="menu-wrapper">
            <h1 class="game-logo">Dungeons & Digits</h1>
            
            <nav class="menu-nav">
                <button class="menu-opt" data-action="start">Campaign</button>
                <button class="menu-opt" data-action="trial">Trial</button>
                <button class="menu-opt" data-action="settings">Settings</button>
                <button class="menu-opt" data-action="credits">Credits</button>
            </nav>
        </div>
    </section>
    
    <section id="screen-settings" class="screen">
        <div class="menu-wrapper">
            <h2 class="game-logo">Settings</h2>
            <div class="settings-pane">
               
            </div>
            <button class="menu-opt" data-action="back">Return</button>
        </div>
    </section>

    <section id="screen-credits" class="screen">
        <div class="menu-wrapper">
            <h2 class="game-logo">Credits</h2>
            <a href="https://github.com/NitrogenDev20">NitrogenDev20</a>
            <a href="https://github.com/Sebminecrafter">Sebminecrafter</a>
            <button class="menu-opt" data-action="back">Return</button>
        </div>
    </section>
</div>
<script>
        var screens = {
    main: document.getElementById('screen-main'),
    settings: document.getElementById('screen-settings'),
    credits: document.getElementById('screen-credits')
};

function showScreen(targetKey) {
    var keys = Object.keys(screens);
    
    for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var element = screens[key];
        
        if (element) {
            if (key === targetKey) {
                element.classList.add('active');
            } else {
                element.classList.remove('active');
            }
        }
    }
}

var uiLayer = document.getElementById('ui-layer');

if (uiLayer) {
    uiLayer.addEventListener('click', (e) => {
        // Fallback for older editors to find the clicked item safely
        var targetElement = e.target || e.srcElement;
        if (!targetElement) return;

        // Force the editor to know this is an element with attributes
        if ('getAttribute' in targetElement) {
            var action = targetElement.getAttribute('data-action');
            if (!action) return;

            if (action === 'start') {
                window.location.href = "/play";
            } else if (action === 'settings') {
                showScreen('settings');
            } else if (action === 'trial') {
                window.location.href = "/trial";
            } else if (action == 'credits') {
                showScreen('credits')
            } else if (action === 'back') {
                showScreen('main');
            }
        }
    });
}
</script>
